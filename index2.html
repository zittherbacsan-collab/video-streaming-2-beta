<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamCast DualScreen Pro</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
        video { width: 100%; max-width: 800px; border-radius: 8px; background: #000; }
        .info { margin-top: 15px; color: #aaa; }
    </style>
</head>
<body>

    <h1>Dual-Screen Video Stream</h1>
    
    <!-- Ginagamit natin ang working direct sample MP4 video -->
    <video id="syncVideo" controls playsinline muted>
        <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div class="info">Buksan ang link na ito sa isa pang tab o window para makita ang live sync!</div>

    <script>
        const video = document.getElementById('syncVideo');
        const channel = new BroadcastChannel('video_sync_channel');
        let isInternalUpdate = false;

        // I-broadcast ang play event
        video.onplay = () => {
            if (!isInternalUpdate) {
                channel.postMessage({ type: 'PLAY', currentTime: video.currentTime });
            }
        };

        // I-broadcast ang pause event
        video.onpause = () => {
            if (!isInternalUpdate) {
                channel.postMessage({ type: 'PAUSE', currentTime: video.currentTime });
            }
        };

        // I-broadcast ang seek/timeupdate kung may magbago ng posisyon
        video.onseeked = () => {
            if (!isInternalUpdate) {
                channel.postMessage({ type: 'SEEK', currentTime: video.currentTime });
            }
        };

        // Makinig sa mga mensahe galing sa kabilang tab
        channel.onmessage = (event) => {
            isInternalUpdate = true;
            const { type, currentTime } = event.data;

            if (Math.abs(video.currentTime - currentTime) > 0.5) {
                video.currentTime = currentTime;
            }

            if (type === 'PLAY') {
                video.play().catch(() => {});
            } else if (type === 'PAUSE') {
                video.pause();
            } else if (type === 'SEEK') {
                video.currentTime = currentTime;
            }

            setTimeout(() => { isInternalUpdate = false; }, 100);
        };
    </script>

</body>
</html>
